<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 링크 연결 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" type="text/css">
    <!-- font-awesome 링크 연결 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>쿠팡 라이브</title>
</head>
<body data-page="faq">
    <div id="smooth-wrapper">
        <div id="smooth-content">
            <div class="header-load"></div>
        
            <main class="section-inner-stack section-inner-width header-offset faq">
                <!-- faq__title -->
                <h1 class="section__title faq__title">
                    자주 묻는 질문
                </h1>
                <div class="w-100 flex-center faq__content">
                    <!-- faq__filter -->
                    <div class="w-100 d-flex faq__filter">
                        <!-- faq__tabs -->
                        <div class="d-flex justify-content-start flex-wrap faq__tabList" role="tablist" aria-label="FAQ 카테고리 필터" aria-orientation="horizontal">
                            <button type="button" class="faq__tab" id="tab-all" role="tab" aria-controls="tabpanel-faq" aria-selected="true">전체</button>
                            <button type="button" class="faq__tab" id="tab-coupangLive" role="tab" aria-controls="tabpanel-faq" aria-selected="false">쿠팡 라이브</button>
                            <button type="button" class="faq__tab" id="tab-creatorMarketPlace" role="tab" aria-controls="tabpanel-faq" aria-selected="false">크리에이터 마켓플레이스</button>
                            <button type="button" class="faq__tab" id="tab-seller" role="tab" aria-controls="tabpanel-faq" aria-selected="false">판매자</button>
                            <button type="button" class="faq__tab" id="tab-creator" role="tab" aria-controls="tabpanel-faq" aria-selected="false">크리에이터</button>
                        </div>
                        <!-- faq__input -->
                        <form class="flex-center faq__search">
                            <label for="faq__input" class="blind">FAQ 검색어 입력</label>
                            <input type="text" id="faq__input" class="faq__input" placeholder="검색어를 입력해 주세요" autocomplete="off">
                            <div class="position-relative button__container">
                                <button type="submit" class="position-absolute button__submit" aria-hidden="true">
                                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                                </button>
                                <button type="reset" class="position-absolute button__reset" aria-label="검색어 지우기" hidden>
                                    <i class="fa-solid fa-x" aria-hidden="true"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                    <!-- faq__list -->
                    <ul class="w-100 accordion faq__list" id="tabpanel-faq" role="tabpanel" aria-labelledby="tab-all">
                    </ul>
                    <!-- faq__pagination -->
                    <nav aria-label="FAQ 페이지네이션">
                        <ul class="flex-center pagination pagination-lg faq__pagination">
                        </ul>
                    </nav>
                </div>
            </main>
        
            <div class="footer-load"></div>
        </div>
    </div>

    <!-- --------------- floating-btn --------------- -->
    <div class="floating-btn-load"></div>

    <!-- --------------- m-nav --------------- -->
    <div class="m-nav-load"></div>

    <!-- Bootstrap 링크 연결 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery 링크 연결 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="./assets/js/faq.js"></script>
    <!-- <script type="module" src="./assets/js/2.js"></script> -->
</body>
</html>
